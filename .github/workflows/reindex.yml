
name: Hourly Site Re-indexing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codezen-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT_NAME: codezen-exs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Required Files
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Checked-out commit:"
          git log -1 --oneline

          echo ""
          echo "Repository root files:"
          ls -la

          echo ""
          echo "Checking required files..."

          FAILED=0

          for FILE in \
            "urls.txt" \
            "_redirects" \
            "28130b9eccde4611b9fe2363899bec2b.txt" \
            "build-sitemap.js" \
            "ping-indexnow.js"
          do
            if [ -s "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "MISSING OR EMPTY: $FILE"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more required root files are missing or empty."
            echo "Check the file names, paths, and checked-out commit above."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN secret is missing."
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID secret is missing."
            exit 1
          fi

          echo ""
          echo "Required files and credentials are present."

      - name: Generate Sitemap and Prepare Deployment
        run: node build-sitemap.js

      - name: Validate Deployment Files
        shell: bash
        run: |
          set -eu

          for FILE in \
            "public/sitemap.xml" \
            "public/_redirects" \
            "public/28130b9eccde4611b9fe2363899bec2b.txt"
          do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: Deployment file missing or empty: $FILE"
              exit 1
            fi
            echo "OK: $FILE"
          done

          cmp _redirects public/_redirects

          grep -q '<lastmod>' public/sitemap.xml
          grep -q '<changefreq>hourly</changefreq>' public/sitemap.xml

          echo "Sitemap and redirect validation passed."

      - name: List Cloudflare Pages Projects
        run: npx --yes wrangler@4 pages project list

      - name: Deploy to Cloudflare Pages
        run: >
          npx --yes wrangler@4 pages deploy public
          --project-name="$PAGES_PROJECT_NAME"
          --commit-dirty=true

      - name: Run IndexNow Ping
        if: success()
        run: node ping-indexnow.js
